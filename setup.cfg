[metadata]
name = view-transition-rl
version = 0.1.0
description = View-transition reinforcement learning project with a self-contained vessel simulator
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.23
    vtk>=9.2
    Pillow>=9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
view_transition_rl.simulation =
    assets/*.json
    assets/*.stl
    assets/reference/*.csv
    assets/reference/*.yaml
    assets/reference/masks/*.png
view_transition_rl =
    envs/README.md
    agents/README.md
    training/README.md
    evaluation/README.md

[options.extras_require]
gui = pyvista>=0.43
import = PyYAML>=6
rl =
    gymnasium>=0.29
    stable-baselines3>=2.3
    torch>=2.0
    tensorboard
    matplotlib
    pyvista>=0.43
    imageio>=2.30
    imageio-ffmpeg>=0.4

[options.entry_points]
console_scripts =
    view-transition-rl = view_transition_rl.__main__:main
    vessel-phantom = vessel_phantom.__main__:main
